spring.application.name=mylibrum

# O Compose da aplicação é iniciado externamente pelo docker compose.
# Pode ser habilitado explicitamente em uma execução local, se necessário.
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}
spring.docker.compose.file=${DOCKER_COMPOSE_FILE:BACK/mylibrum/docker-compose.yml}
spring.docker.compose.lifecycle-management=start-and-stop

# Chave Base64 com pelo menos 256 bits. Substitua por uma variável de ambiente em produção.
jwt.secret=${JWT_SECRET:bXlsaWJydW0tc2VjcmV0LWtleS1mb3ItZGV2LW9ubHktMzItYnl0ZXM=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# URL base do frontend usada no link de recuperação de senha enviado por e-mail.
# As credenciais SMTP não ficam aqui: são lidas das configurações do sistema (tabela configuracoes).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# ===============================
# CONFIGURAÇÕES DO POSTGRESQL
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/librumDb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ===============================
# Mostra no console as consultas SQL geradas pelo Hibernate (útil para debug)
spring.jpa.show-sql=true

# Atualiza o esquema do banco de dados automaticamente (use 'update' para dev e 'validate' ou 'none' para produção)
spring.jpa.hibernate.ddl-auto=none

# Executa as migrations versionadas uma única vez por banco.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Define o dialeto do PostgreSQL para o Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.file.name=logs/myLibrum.log