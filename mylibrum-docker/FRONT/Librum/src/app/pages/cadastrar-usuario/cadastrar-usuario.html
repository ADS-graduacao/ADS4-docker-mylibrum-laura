<app-corpo-padrao>

  <div class="titulo">Cadastrar Novo Usuário</div>

  <form class="corpo" [formGroup]="formUsuario" (ngSubmit)="salvar()">
    <app-alerta-erros [mensagens]="mensagensErro"></app-alerta-erros>

    <div class="row mb-3">
      <div class="col-md-8">
        <label class="form-label">ID do Usuário</label>
        <input type="text" class="form-control" formControlName="id">
      </div>

      <div class="col-md-4 text-center">
        <label class="form-label">Foto</label>
        <div class="border p-3 rounded">
          <input type="file" (change)="onFileSelect($event)" class="form-control">
        </div>
      </div>
    </div>

    <hr>
    <h6 class="mt-3">Dados Pessoais</h6>

    <div class="mb-3">
      <label class="form-label">Nome Completo *</label>
      <input type="text" class="form-control" formControlName="nome" [class.is-invalid]="isInvalido('nome')">
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Data de Nascimento *</label>
        <input type="date" class="form-control" formControlName="dataNascimento"
          [class.is-invalid]="isInvalido('dataNascimento')">
      </div>

      <div class="col-md-6">
        <label class="form-label">CPF *</label>
        <input type="text" class="form-control" [imask]="Mask.CPF" formControlName="cpf"
          [class.is-invalid]="isInvalido('cpf')">
      </div>
    </div>

    <hr>
    <h6>Contato</h6>

    <div class="mb-3">
      <label class="form-label">Endereço *</label>
      <input type="text" class="form-control" formControlName="endereco" [class.is-invalid]="isInvalido('endereco')">
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Telefone *</label>
        <input type="text" class="form-control" [imask]="Mask.CELULAR" formControlName="telefone"
          [class.is-invalid]="isInvalido('telefone')">
      </div>

      <div class="col-md-6">
        <label class="form-label">Email *</label>
        <input type="email" class="form-control" formControlName="email" [class.is-invalid]="isInvalido('email')">
      </div>
    </div>

    <hr>
    <h6>Informações da Conta</h6>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Data de Cadastro</label>
        <input type="text" class="form-control" formControlName="dataCadastro">
      </div>

      <div class="col-md-6">
        <label class="form-label">Tipo de Cliente *</label>
        <select class="form-select" formControlName="tipoCliente" [class.is-invalid]="isInvalido('tipoCliente')">
          <option value="">Selecione...</option>
          <option value="estudante">Estudante</option>
          <option value="professor">Professor</option>
          <option value="outro">Outro</option>
        </select>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Senha *</label>
        <input type="password" class="form-control" formControlName="senha" [class.is-invalid]="isInvalido('senha')">
      </div>

      <div class="col-md-6">
        <label class="form-label">Confirmar Senha *</label>
        <input type="password" class="form-control" formControlName="confirmarSenha"
          [class.is-invalid]="isInvalido('confirmarSenha')">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Status</label>
      <input type="text" class="form-control" formControlName="status">
    </div>

    <div class="mb-3">
      <label class="form-label">Observação</label>
      <textarea class="form-control" rows="3" formControlName="observacao"></textarea>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button type="button" lbrButton variant="cancelar" (click)="cancelar()">Cancelar</button>
      <button type="submit" lbrButton variant="cadastrar">Salvar</button>
    </div>
  </form>
</app-corpo-padrao>
