<app-corpo-padrao>
  <div class="titulo">Configurações</div>

  <div class="corpo">

    <h6>Aparência</h6>

    <div class="row mb-3">
      <div class="col-md-6">
        <button class="btn w-100" [ngClass]="
            themeService.getCurrentTheme() === 'light'
              ? 'btn-primary'
              : 'btn-outline-secondary'
          " (click)="alterarTema('light')">
          Tema Claro
        </button>
      </div>

      <div class="col-md-6">
        <button class="btn w-100" [ngClass]="
            themeService.getCurrentTheme() === 'dark'
              ? 'btn-primary'
              : 'btn-outline-secondary'
          " (click)="alterarTema('dark')">
          Tema Escuro
        </button>
      </div>
    </div>

    <hr>

    <!-- dados -->
    <h6>Dados do Bibliotecário</h6>

    <form [formGroup]="formBibliotecario" (ngSubmit)="salvarAlteracoes()">

      <app-alerta-erros [mensagens]="mensagensErro"></app-alerta-erros>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">ID</label>
          <input type="text" class="form-control" [disabled]="!editando" formControlName="id">
        </div>

        <div class="col-md-6">
          <label class="form-label">Matrícula *</label>
          <input type="text" class="form-control" [disabled]="!editando" formControlName="matricula"
            [class.is-invalid]="isInvalido('matricula')">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Nome Completo *</label>
        <input type="text" class="form-control" [disabled]="!editando" formControlName="nome"
          [class.is-invalid]="isInvalido('nome')">
      </div>

      <div class="mb-3">
        <label class="form-label">Email *</label>
        <input type="email" class="form-control" [disabled]="!editando" formControlName="email"
          [class.is-invalid]="isInvalido('email')">
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Nova Senha</label>
          <input type="password" class="form-control" formControlName="senha"
            placeholder="Deixe em branco para manter a atual" [disabled]="!editando" autocomplete="new-password"
            [class.is-invalid]="isInvalido('senha')">
        </div>

        <div class="col-md-6">
          <label class="form-label">Confirmar Nova Senha</label>
          <input type="password" [disabled]="!editando" class="form-control" formControlName="confirmarSenha"
            autocomplete="new-password" [class.is-invalid]="isInvalido('confirmarSenha')">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-3 mb-3">
        <button lbrButton [variant]="!editando ? 'editar' : 'excluir'  " type="button" (click)="toggleEditar()">
          {{ editando ? 'Cancelar' : 'Editar' }}
        </button>
        <button type="submit" lbrButton variant="cadastrar">Salvar Alterações</button>
      </div>
    </form>

    <hr>

    <!-- notificações -->
    <h6>Notificações</h6>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" [(ngModel)]="notificacoes.gerais">
      <label class="form-check-label ms-2">
        Notificações Gerais
      </label>
    </div>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" [(ngModel)]="notificacoes.email">
      <label class="form-check-label ms-2">
        Notificações por Email
      </label>
    </div>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" [(ngModel)]="notificacoes.alertas">
      <label class="form-check-label ms-2">
        Alertas do Sistema
      </label>
    </div>

    <hr>
    <h6>Tela</h6>
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" [(ngModel)]="isExibirAcoesRapidas" (change)="alterarAcaoRapida()">
      <label class="form-check-label ms-2">
        Ações rápidas
      </label>
    </div>

    <hr>

    <!-- segurança -->
    <h6>Segurança</h6>

    <div class="row mb-3">
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100" (click)="alterarSenha()">
          Alterar Senha
        </button>
      </div>

      <div class="col-md-6">
        <button class="btn btn-outline-success w-100" (click)="ativar2FA()">
          Autenticação em 2 Fatores
        </button>
      </div>
    </div>

    <hr>

    <!-- sistema -->
    <h6>Sistema</h6>

    <div class="row mb-3">
      <div class="col-md-6">
        <label>Versão do Sistema</label>
        <input type="text" class="form-control" [value]="versaoSistema" disabled>
      </div>

      <div class="col-md-6 d-flex align-items-end">
        <button class="btn btn-primary w-100" (click)="verificarAtualizacoes()">
          Verificar Atualizações
        </button>
      </div>
    </div>

    <div class="row">
      <div class="col-md-8">
        <label>Último Backup</label>
        <input type="text" class="form-control" [value]="ultimoBackup" disabled>
      </div>

      <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-success w-100" (click)="fazerBackup()">
          Fazer Backup
        </button>
      </div>
    </div>
  </div>

  <app-corpo-padrao>
