<!-- TODO : personalizar melhor a modal -->

<app-modal (isOpenChange)="isOpenChange.emit($event)" [(isOpen)]="isOpen" title="Informações do Livro">
  <div class="modal-body">

    <div class="p-4 rounded-3 bg-verde text-white mb-4" style="position: relative; min-height: 150px;">

      <h6 class="mb-1">{{ exemplar?.livro?.titulo}}</h6>
      <small>{{ exemplar?.livro?.autores }}</small>

      <span class="position-absolute bottom-0 start-0 m-3 small">
        {{ exemplar?.livro?.id }}
      </span>

    </div>

    <div class="container-fluid px-0">

      <div class="d-flex justify-content-between border-bottom py-2">
        <span class="text-muted">ID:</span>
        <strong>{{ exemplar?.livro?.id }}</strong>
      </div>

      <div class="d-flex justify-content-between border-bottom py-2">
        <span class="text-muted">Título:</span>
        <strong>{{ exemplar?.livro?.titulo }}</strong>
      </div>

      <div class="d-flex justify-content-between border-bottom py-2">
        <span class="text-muted">Autor:</span>
        <strong>{{ exemplar?.livro?.autores }}</strong>
      </div>

      <div class="d-flex justify-content-between py-2 align-items-center">
        <span class="text-muted">Localização:</span>
        <span class="badge bg-warning text-dark">
          {{exemplar?.posicao }}
        </span>
      </div>

    </div>

  </div>
</app-modal>
