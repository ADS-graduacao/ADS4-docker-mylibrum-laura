<app-corpo-padrao>


  <div class="titulo">Relatórios</div>
  <div class="subtitulo">Unidade São Paulo - Centro</div>

  <section class="corpo">

    <div class="row">
      <p class="fw-bold">Gerar Novo Raelatório</p>
      <p class="text-muted">Tipos de Dados</p>
    </div>
    <div class="row row-gap-2 ">
      @for (tipo of tiposRelatorio; track $index) {
      <div class="col-sm-11 col-md-6 col-lg-3 ">
        <div class="ps-3 border rounded-2 py-2"
          [ngClass]="selectedTipos.includes(tipo.id) ? 'border-primary':'border-secondary'">
          <input class="form-check-input border-secondary" type="checkbox" [value]="tipo.id" [id]="tipo.id"
            (click)="onCheckboxChange($event,tipo.id)">
          <label class="form-check-label ms-2" [for]="tipo.id">
            {{ tipo.nome }}
          </label>
        </div>
      </div>
      }
    </div>
    <div class="row mt-3">
      <div class="col-sm-12 col-md-6">
        <label for="inicio" class="form-label">Data inicio</label>
        <input type="date" name="inicio" id="inicio" class="form-control">
      </div>
      <div class="col-sm-12 col-md-6">
        <label for="fim" class="form-label">Data fim</label>
        <input type="date" name="fim" id="fim" class="form-control">
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-12">
        <button lbrButton variant="outros" class="w-100" (click)="gerarRelatorio()"> Gerar
          relatório</button>
      </div>
    </div>
  </section>
