<app-modal title="Cadastrar Autor" [isOpen]="true" (isOpenChange)="cancelar()">
    <form [formGroup]="form" (ngSubmit)="salvar()">

        <div class="mb-3">
            <label class="form-label">Nome *</label>

            <input type="text" class="form-control" formControlName="nome" [class.is-invalid]="
          form.get('nome')?.invalid && form.get('nome')?.touched
        ">

            <div class="invalid-feedback" *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched">
                O nome é obrigatório.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Nacionalidade</label>
            <input type="text" class="form-control" formControlName="nacionalidade">
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Data de Nascimento</label>

                <input type="date" class="form-control" formControlName="dataNascimento">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Data de Falecimento</label>

                <input type="date" class="form-control" formControlName="dataFalecimento">
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">Biografia</label>

            <textarea class="form-control" rows="4" formControlName="biografia"></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">

            <button type="button" class="btn btn-secondary" (click)="cancelar()" [disabled]="salvando">
                Cancelar
            </button>

            <button type="submit" class="btn btn-primary" [disabled]="salvando">
                {{ salvando ? 'Salvando...' : 'Salvar' }}
            </button>

        </div>

    </form>
</app-modal>
